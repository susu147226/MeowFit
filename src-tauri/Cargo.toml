[package]
name = "meowfit"
version = "0.5.2"
description = "喵尺 MeowFit — 本地媒体尺寸批量调整工具（仅 Windows）"
authors = ["云舒眠眠"]
edition = "2021"
# 本项目采用自定义的专有许可证，非 OSI 认可的开源许可证。
# 条款见仓库根目录的 LICENSE 文件。
license-file = "../LICENSE"
publish = false

[lib]
# `_lib` 后缀用于避免 Windows 上 lib 名与 bin 名冲突
# https://github.com/rust-lang/cargo/issues/8519
name = "meowfit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 前缀分组正则
regex = "1"
# 素材递归扫描
walkdir = "2"
# 包含 / 排除通配符（规范 5.5）
globset = "0.4"
# 静态位图处理引擎（规范 5.4）
image = "0.25"
# 日志与报告时间戳
chrono = "0.4"
# 图片容器级元数据读写：ICC / EXIF / XMP（规范 6.8）
img-parts = "0.3"
# SVG 光栅化（规范 5.4 / 10.5）
resvg = "0.48"
# SVG 文本渲染所需的系统字体（与 usvg 使用的版本保持一致）
fontdb = "0.24"
# 把本地背景图编码成 data URL 交给界面渲染（规范 6.14）
base64 = "0.22"

# 体积优化：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
